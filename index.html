    <style>:root {
    color-scheme: dark;
    font-family: system-ui, sans-serif;
    background: #000;
    color: #eee;
}

* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
[hidden] { display: none !important; }

#viewport {
    position: fixed;
    inset: 0;
}

#canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    touch-action: none;
}

#loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    overflow-y: auto;
    padding: 24px;
    background: #000;
    text-align: center;
}

#loading > * { flex-shrink: 0; }
#status { max-width: 48em; overflow-wrap: anywhere; }
progress { width: min(320px, 100%); height: 8px; }
button { padding: 10px 16px; border: 1px solid #444; border-radius: 6px; background: #171717; color: inherit; font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid #eee; outline-offset: 3px; }
button:disabled { opacity: 0.55; cursor: wait; }
#source-chooser { max-width: 32em; }
.source-buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.source-formats { margin: 20px 0 0; color: #a8a8a8; font-size: 0.9em; line-height: 1.5; }
#source-own { background: #eee; color: #111; border-color: #eee; }
#source-error { color: #ffb6a9; line-height: 1.5; }
#source-error:empty { display: none; }
</style>
</head>
<body>
    <main id="viewport">
        <canvas id="canvas" width="1280" height="720" tabindex="0" aria-label="open nectar game"></canvas>
    </main>
    <section id="loading" aria-live="polite">
        <p id="status">loading open nectar...</p>
        <progress id="progress" aria-label="game loading"></progress>
        <div id="source-chooser" hidden>
            <div class="source-buttons">
                <button id="source-own" type="button">upload rom</button>
                <button id="source-cached" type="button" hidden>play saved rom</button>
                <button id="source-packaged" type="button" hidden>play included copy</button>
                <button id="source-cancel" type="button" hidden>cancel import</button>
            </div>
            <p class="source-formats">gamecube · iso/gcm, rvz, wia, gcz, ciso, tgc, wbfs · usa rev. 1 or europe</p>
            <p id="source-error" role="alert"></p>
        </div>
        <button id="report" type="button" hidden>save error report</button>
    </section>
    <input id="file-picker" type="file" accept=".zip,application/zip" hidden>
    <input id="game-source-file" type="file" accept=".iso,.gcm,.rvz,.wia,.gcz,.ciso,.tgc,.wbfs" hidden>
    <template id="runtime-script"><script src="nectar.js"></script></template>
    
    
    
    
    
    <script>(() => {
    class PackArchive {
        static maxFileBytes = 64 * 1024 * 1024;
        static checksumTable = Uint32Array.from({length: 256}, (_, value) => {
            for (let bit = 0; bit < 8; bit++) {
                value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
            }
            return value >>> 0;
        });

        constructor(file, entries, centralOffset) {
            this.file = file;
            this.entries = entries;
            this.centralOffset = centralOffset;
        }

                if (action === 2) return this.installTextures(file);

        async installTextures(file) {
            this.notice('checking texture pack...');
            const installed = await this.library.installZip(file, (files, total) => this.progress(files, total));
            await this.library.select(installed.id);
            return `${installed.files} textures installed. pack active.`;
        }

        selectTexture(id) {
            return this.run(2, async () => {
                await this.library.select(id);
                return id ? 'texture pack active.' : 'original textures restored.';
            });
        }

        async installModel(file, kind) {
            this.notice('checking model archive...');
            const archive = await Nectar.PackArchive.open(file);
            for (const entry of archive.entries) {
                const bytes = await archive.read(entry);
                if (entry.name.toLowerCase().endsWith('.png')) {
                    Nectar.TextureLibrary.validateTexture('model.png', bytes);
                }
            }
            this.notice('converting model pack...');
            await new Promise(resolve => setTimeout(resolve, 0));
            await this.runtime.nectarInstallZip(new Uint8Array(await file.arrayBuffer()), kind, file.name);
            return 'model installed. use the in-game restart prompt to apply it.';
        }

        async restore(file) {
            if (file.size > Nectar.SaveArchive.maxTextLength) throw new Error('the save backup is too large');
            const text = await file.text();
            Nectar.SaveArchive.decode(text);
            if (!confirm('restore this backup and restart the game? current saves will be replaced, and unsaved progress will be lost.')) return null;
            await SaveTransfer.write(text);
            this.restarting = true;
            location.reload();
            return 'restarting to restore the backup...';
        }

        static download(data, name, type) {
            const url = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], {type}));
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }
    }

    Object.assign(globalThis.Nectar, {GameFiles, SaveTransfer, SaveArchive});
})();

(() => {
    const maxBytes = 2 * 1024 * 1024 * 1024;
    const supported = {'GPIE01:1': 'pikmin usa rev. 1', 'GPIP01:0': 'pikmin europe', 'GPVP01:0': 'pikmin 2 europe', 'GPVE01:0': 'pikmin 2 usa'};

    function safePath(path) {
        return typeof path === 'string' && path.length < 1024
            && /^(?:(dataDir|MovieData|user|AudioRes|movie|new_screen|System|system|banner|enemy|memoryCard|message|thp)\/|gameConfig\.ini$)/.test(path)
            && path.split('/').every(name => name && name !== '.' && name !== '..' && !/[\x00-\x1f\\:]/.test(name));
    }

    function scan(read, size) {
        const header = read(0, 0x440);
        const view = new DataView(header.buffer, header.byteOffset, header.byteLength);
        if (view.getUint32(0x1c) !== 0xc2339f3d) throw new Error('choose a gamecube pikmin disc image. wii discs are unsupported.');
        const gameId = new TextDecoder().decode(header.subarray(0, 6));
        const revision = header[7];
        const key = gameId + ':' + revision;
        if (!supported[key]) throw new Error('unsupported disc. choose pikmin usa rev. 1, pikmin europe, or pikmin 2 usa or europe.');
        const pikmin2 = gameId === 'GPVP01' || gameId === 'GPVE01';
        const limit = pikmin2 ? maxBytes : maxBytes / 2;
        const offset = view.getUint32(0x424), length = view.getUint32(0x428);
        if (length < 12 || length > 16 * 1024 * 1024 || offset > size || length > size - offset) throw new Error('the disc file table is damaged.');
        const bytes = read(offset, length);
        const fst = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const count = fst.getUint32(8);
        if (bytes[0] !== 1 || !count || count > 65536 || count * 12 > length) throw new Error('the disc file table is invalid.');
        const strings = count * 12;
        const stack = [{index: 0, end: count, path: ''}];
        const files = [], paths = new Set();
        let total = 0;
        for (let i = 1; i < count; ++i) {
            while (i >= stack.at(-1).end && stack.length > 1) stack.pop();
            const parent = stack.at(-1);
            const word = fst.getUint32(i * 12), type = word >>> 24;
            if (type > 1) throw new Error('the disc file table has an invalid entry.');
            const begin = strings + (word & 0xffffff);
            const end = bytes.indexOf(0, begin);
            if (begin >= length || end < begin || end - begin > 255) throw new Error('the disc has an invalid filename.');
            const raw = bytes.subarray(begin, end);
            let name;
            try { name = new TextDecoder('utf-8', {fatal: true}).decode(raw); }
            catch { name = new TextDecoder('shift-jis').decode(raw); }
            if (!name || name === '.' || name === '..' || /[\x00-\x1f/\\:]/.test(name)) throw new Error('the disc contains an unsafe filename.');

            const location = fst.getUint32(i * 12 + 4), amount = fst.getUint32(i * 12 + 8);

            } else {
                if (location > size || amount > size - location) throw new Error('a disc file points outside the image.');
                if (!(pikmin2 ? /^(?:(user|AudioRes|movie|new_screen|System|system|banner|enemy|memoryCard|message|thp)\/|gameConfig\.ini$)/ : /^(dataDir|MovieData)\//).test(path)) continue;
                if (!safePath(path) || paths.has(path)) throw new Error('the disc contains an invalid or duplicate game-data path.');

                total += amount;
                if (total > limit) throw new Error('the game data exceeds the supported size.');

                files.push({path, offset: location, size: amount});

        return {gameId, revision, key, description: supported[key], files, bytes: total};
    }

})();

(() => {
    const request = item => new Promise((resolve, reject) => {
        item.onsuccess = () => resolve(item.result);
        item.onerror = () => reject(item.error);
    });
    const complete = transaction => new Promise((resolve, reject) => {
        transaction.oncomplete = resolve;
        transaction.onabort = transaction.onerror = () => reject(transaction.error || new Error('game-data storage failed.'));
    });
    async function open() {
        const item = indexedDB.open(Nectar.game === 'pikmin2' ? 'nectar-pikmin2-own-game' : 'nectar-own-game', 1);
        item.onupgradeneeded = () => {
            item.result.createObjectStore('installs');
            item.result.createObjectStore('files');
        };
        return request(item);
    }
    async function write(db, store, key, value) {
        const transaction = db.transaction(store, 'readwrite');
        const done = complete(transaction);
        transaction.objectStore(store).put(value, key);
        await done;
    }
    async function read(db, store, key) {
        return request(db.transaction(store).objectStore(store).get(key));
    }
    async function remove(db, id) {
        const transaction = db.transaction(['installs', 'files'], 'readwrite');
        const done = complete(transaction);
        transaction.objectStore('installs').delete(id);
        const cursor = transaction.objectStore('files').openKeyCursor(IDBKeyRange.bound([id, ''], [id, '\uffff']));
        cursor.onsuccess = () => {
            if (!cursor.result) return;
            transaction.objectStore('files').delete(cursor.result.primaryKey);
            cursor.result.continue();
        };
        await done;
    }
    async function active(db) {
        const id = await read(db, 'installs', 'active');
        if (!id) return null;
        const install = await read(db, 'installs', id);
        if (!install || install.state !== 'ready') return null;
        return install;
    }
    async function commit(db, install) {
        const transaction = db.transaction('installs', 'readwrite');
        const done = complete(transaction);
        const store = transaction.objectStore('installs');
        store.put({...install, state: 'ready'}, install.id);
        store.put(install.id, 'active');
        await done;
    }
    async function clean(db, keepId) {
        const keys = await request(db.transaction('installs').objectStore('installs').getAllKeys());
        for (const id of keys) if (id !== 'active' && id !== keepId) await remove(db, id);
    }
    (globalThis.Nectar ||= {}).DiscStore = {open, read, write, remove, active, commit, clean};
})();

(() => {
    const Store = Nectar.DiscStore;

    async function downloadRom(manifest, runtime, signal) {
        const {parts, bytes, name} = manifest;
        if (!Array.isArray(parts) || !parts.length || parts.length > 10000
            || !Number.isSafeInteger(bytes) || bytes <= 0 || typeof name !== 'string'
            || !/\.(iso|gcm|rvz|wia|gcz|ciso|tgc|wbfs)$/i.test(name)) {
            throw new Error('the included rom manifest is invalid');
        }
        const paths = new Set();
        let total = 0;
        for (const part of parts) {
            if (!/^rom\/part-[0-9]{5}\.bin$/.test(part.path) || paths.has(part.path)
                || !Number.isSafeInteger(part.bytes) || part.bytes <= 0 || part.bytes > 20000000
                || !/^[a-f0-9]{64}$/.test(part.sha256)) throw new Error('the included rom part is invalid');
            paths.add(part.path);
            total += part.bytes;
        }
        if (total !== bytes) throw new Error('the included rom size is invalid');
        const controller = new AbortController();
        const abort = () => controller.abort(signal.reason);
        signal.addEventListener('abort', abort, {once: true});
        if (signal.aborted) abort();
        const blobs = new Array(parts.length);
        let next = 0, completed = 0, failure;
        const download = async () => {
            try {
                while (next < parts.length) {
                    controller.signal.throwIfAborted();
                    const index = next++, part = parts[index];
                    const response = await fetch(part.path, {signal: controller.signal});
                    if (!response.ok) throw new Error('could not download the included rom part: ' + part.path);
                    const blob = await response.blob();
                    if (blob.size !== part.bytes) throw new Error('the included rom part is incomplete: ' + part.path);
                    const checksum = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', await blob.arrayBuffer())),
                        byte => byte.toString(16).padStart(2, '0')).join('');
                    if (checksum !== part.sha256) throw new Error('the included rom part is damaged: ' + part.path);
                    controller.signal.throwIfAborted();
                    blobs[index] = blob;
                    completed += blob.size;
                    runtime.ui.progress.max = bytes;
                    runtime.ui.progress.value = completed;
                    runtime.setStatus('downloading rom… ' + Math.floor(completed * 100 / bytes) + '%');
                }
            } catch (error) { failure ||= error; controller.abort(); }
        };
        try { await Promise.all([download(), download()]); }
        finally { signal.removeEventListener('abort', abort); }
        if (failure) throw failure;
        signal.throwIfAborted();
        return new File(blobs, name);
    }

    async function choose(runtime, bundled, build) {
        const ui = runtime.ui;
        let cached = null;
        try {
            const db = await Store.open();
            try {
                cached = await Store.active(db);
                await Store.clean(db, cached?.id);
            } finally { db.close(); }
        } catch (error) { runtime.record('disc storage', error.message || error); }

        ui['source-chooser'].hidden = false;
        ui.progress.hidden = true;
        ui.status.hidden = true;
        ui['source-packaged'].hidden = !bundled;
        ui['source-packaged'].textContent = bundled?.rom ? 'play' : 'play included copy';
        ui['source-cached'].hidden = !cached || !Object.hasOwn(build.runtimes, cached.key);
        let importing = false;
        return new Promise(resolve => {
            const finish = choice => {
                ui['source-chooser'].hidden = true;
                ui.progress.hidden = false;
                runtime.setStatus('loading…');
                resolve(choice);
            };
            ui['source-packaged'].onclick = () => bundled?.rom
                ? importFile(signal => downloadRom(bundled.rom, runtime, signal)) : finish({bundled});
            ui['source-cached'].onclick = () => finish({install: cached});
            ui['source-own'].onclick = () => { ui['game-source-file'].value = ''; ui['game-source-file'].click(); };
            const importFile = async source => {
                if (!source || importing) return;
                importing = true;
                const controller = new AbortController();
                ui['source-error'].textContent = '';
                for (const name of ['source-own', 'source-packaged', 'source-cached']) ui[name].disabled = true;
                ui['source-cancel'].hidden = false;
                ui.progress.hidden = false;
                runtime.setStatus('opening rom…');
                ui.progress.removeAttribute('value');
                ui['source-cancel'].onclick = () => controller.abort(new Error('import canceled. your previous copy is unchanged.'));
                const id = 'disc-' + Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, '0')).join('');
                let worker;
                let abort;
                try {
                    const file = typeof source === 'function' ? await source(controller.signal) : source;
                    controller.signal.throwIfAborted();
                    const install = await new Promise((done, reject) => {
                        worker = new Worker('nectar-disc-worker.js');
                        abort = () => reject(controller.signal.reason);
                        controller.signal.addEventListener('abort', abort, {once: true});
                        worker.onerror = () => reject(new Error('the disc importer could not start. keep the decoder files with this web build.'));
                        worker.onmessage = ({data}) => {
                            if (data.type === 'progress') {
                                runtime.setStatus(data.text);
                                if (data.total) { ui.progress.max = data.total; ui.progress.value = data.done; }
                            } else if (data.type === 'ready') {
                                ui['source-cancel'].hidden = true;
                                controller.signal.removeEventListener('abort', abort);
                                done(data.install);
                            } else if (data.type === 'error') reject(new Error(data.text));
                        };
                        worker.postMessage({file, id, supported: build.runtimes, game: build.game});
                    });
                    const db = await Store.open();
                    try {
                        await Store.commit(db, install);
                        await Store.clean(db, id).catch(error => runtime.record('disc storage', error.message));
                    } finally { db.close(); }
                    finish({install});
                } catch (error) {
                    controller.abort();
                    worker?.terminate();
                    try {
                        const db = await Store.open();
                        try { await Store.remove(db, id); } finally { db.close(); }
                    } catch {}
                    ui.status.hidden = true;
                    ui['source-error'].textContent = error.message || String(error);
                    ui.progress.hidden = true;
                } finally {
                    if (abort) controller.signal.removeEventListener('abort', abort);
                    worker?.terminate();
                    importing = false;
                    ui['source-cancel'].hidden = true;
                    for (const name of ['source-own', 'source-packaged', 'source-cached']) ui[name].disabled = false;
                }
            };
            ui['game-source-file'].onchange = () => importFile(ui['game-source-file'].files[0]);
            ui['source-chooser'].ondragover = event => { event.preventDefault(); };
            ui['source-chooser'].ondrop = event => {
                event.preventDefault();
                if (event.dataTransfer.files.length !== 1) { ui['source-error'].textContent = 'drop one game image at a time.'; return; }
                importFile(event.dataTransfer.files[0]);
            };
        });
    }

    async function load(install, fs, runtime) {
        const {files} = install;
        if (!Array.isArray(files) || !files.length || files.length > 65536) throw new Error('the saved game-data manifest is invalid. import your disc again.');
        const paths = new Set();
        let total = 0;
        for (const file of files) {
            if (!Nectar.DiscFiles.safePath(file.path) || paths.has(file.path) || !Number.isSafeInteger(file.size)
                || file.size < 0 || file.size > 256 * 1024 * 1024) throw new Error('the saved game data contains an invalid file.');
            paths.add(file.path);
            total += file.size;
        }
        const marker = ['GPVP01:0', 'GPVE01:0'].includes(install.key) ? 'AudioRes/PSound.aaf' : 'dataDir/parms/gamePrms.bin';
        if (total > Nectar.DiscFiles.maxBytes || !files.some(file => file.path === marker && file.size > 0)) throw new Error('the saved game data is incomplete.');
        const db = await Store.open();
        try {
            let completed = 0;
            for (const file of files) {
                const blob = await Store.read(db, 'files', [install.id, file.path]);
                if (!(blob instanceof Blob) || blob.size !== file.size) throw new Error('saved game data is missing or damaged. import your disc again.');
                const path = '/assets/' + file.path;
                fs.mkdirTree(path.slice(0, path.lastIndexOf('/')));
                fs.writeFile(path, new Uint8Array(await blob.arrayBuffer()), {canOwn: true});
                completed += file.size;
                runtime.ui.progress.max = total;
                runtime.ui.progress.value = completed;
                runtime.setStatus('loading ' + install.description.toLowerCase() + '… ' + Math.floor(completed * 100 / total) + '%');
            }
        } finally { db.close(); }
    }
    Nectar.Discs = {choose, load};
})();

                    output.push({name, bytes: await blob.arrayBuffer()});
                }
                return output;
            }
            if (operation !== 'install') throw new Error('unknown texture storage operation');
            const directory = crypto.randomUUID();
            try {
                const result = await runWorker([Nectar.CdnSources.packs, '\n', Nectar.CdnSources.packWorker],
                    {file: args.file, directory}, data => storage.put('pack-files',
                        [directory, data.args.name, data.args.part], data.args.blob),
                    data => this.progress?.(data.done, data.total));
                const slug = args.file.name.replace(/\.zip$/i, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 48) || 'pack';
                const pack = {version: 2, id: 'web-' + slug + '-' + crypto.randomUUID().slice(0, 8), directory,
                    name: args.file.name.replace(/\.zip$/i, '').slice(0, 100), bytes: result.bytes,
                    files: result.entries.length, entries: result.entries};
                await storage.put('packs', pack.id, pack);
                return pack;
            } catch (error) {
                await storage.removeRange('pack-files', IDBKeyRange.bound([directory, ''], [directory, '\uffff'])).catch(() => {});
                throw error;
            }
        }
    }
    Nectar.TextureLibrary = IndexedTextureLibrary;
    Nectar.SaveTransfer.access = (mode, action) => storage.access('transfer', mode, action);
    Nectar.DiscStore.open = async () => {
        await storage.open();
        return request(indexedDB.open(config.storage, 1));
    };
    const originalRead = Nectar.DiscStore.read;
    Nectar.DiscStore.read = async (db, name, key) => {
        if (name !== 'files') return originalRead(db, name, key);
        const install = await originalRead(db, 'installs', key[0]);
        const entry = install?.files.find(file => file.path === key[1]);
        if (!entry) throw new Error('the saved game-data manifest is missing');
        return storage.chunks('files', key, entry.size);
    };

    async function importDisc(file, runtime, build, signal) {
        const id = 'disc-' + crypto.randomUUID();
        try {
            const [script, wasm] = await Promise.all([resource('nectar-disc.js', signal), resource('nectar_disc.wasm', signal)]);
            const result = await runWorker([await script.text(), '\n', Nectar.CdnSources.discFiles, '\n', Nectar.CdnSources.discWorker],
                {file, id, supported: build.runtimes, wasm: await wasm.arrayBuffer()}, data => {
                    if (data.operation === 'install') return storage.put('installs', id, data.args.install);
                    if (data.operation === 'file') return storage.put('files', [id, data.args.path, data.args.part], data.args.blob);
                    throw new Error('unknown disc storage operation');
                }, data => {
                    runtime.setStatus(data.text);
                    runtime.ui.progress.max = data.total;
                    runtime.ui.progress.value = data.done;
                }, signal);
            signal?.throwIfAborted();
            runtime.ui['source-cancel'].hidden = true;
            const db = await storage.open();
            await Nectar.DiscStore.commit(db, result.install);
            await Nectar.DiscStore.clean(db, id).catch(error => runtime.record('disc storage', String(error)));
            return result.install;
        } catch (error) {
            await Nectar.DiscStore.remove(await storage.open(), id).catch(() => {});
            throw error;
        }
    }

    async function downloadRom(runtime, signal) {
        const blobs = new Array(config.rom.parts.length);
        let next = 0, done = 0, failure;
        const controller = new AbortController();
        const abort = () => controller.abort(signal.reason);
        signal.addEventListener('abort', abort, {once: true});
        if (signal.aborted) abort();
        const download = async () => {
            try {
                while (next < blobs.length) {
                    controller.signal.throwIfAborted();
                    const index = next++;
                    blobs[index] = await resource(config.rom.parts[index], controller.signal);
                    done += blobs[index].size;
                    runtime.ui.progress.max = config.rom.bytes;
                    runtime.ui.progress.value = done;
                    runtime.setStatus('downloading rom… ' + Math.floor(done / config.rom.bytes * 100) + '%');
                }
            } catch (error) { failure ||= error; controller.abort(); }
        };
        try { await Promise.all([download(), download()]); }
        finally { signal.removeEventListener('abort', abort); }
        if (failure) throw failure;
        signal.throwIfAborted();
        return new File(blobs, config.rom.name);
    }

    Nectar.Discs.choose = async (runtime, bundled, build) => {
        const ui = runtime.ui;
        const db = await storage.open();
        const cached = await Nectar.DiscStore.active(db);
        await Nectar.DiscStore.clean(db, cached?.id);
        ui['source-chooser'].hidden = false;
        ui.progress.hidden = true; ui.status.hidden = true;
        ui['source-cached'].hidden = !cached || !Object.hasOwn(build.runtimes, cached.key);
        ui['source-packaged'].hidden = !config.rom;
        ui['source-packaged'].textContent = 'play';
        let importing = false;
        return new Promise(resolve => {
            const finish = install => {
                ui['source-chooser'].hidden = true; ui.progress.hidden = false;
                runtime.setStatus('loading…'); resolve({install});
            };
            const run = async getFile => {
                if (importing) return;
                importing = true;
                const controller = new AbortController();
                ui['source-error'].textContent = '';
                for (const name of ['source-own', 'source-cached', 'source-packaged']) ui[name].disabled = true;
                ui['source-cancel'].hidden = false; ui.progress.hidden = false;
                ui.progress.removeAttribute('value'); runtime.setStatus('opening rom…');
                ui['source-cancel'].onclick = () => controller.abort();
                try {
                    const file = await getFile(controller.signal);
                    if (file) finish(await importDisc(file, runtime, build, controller.signal));
                } catch (error) {
                    controller.abort();
                    ui.status.hidden = true; ui.progress.hidden = true;
                    ui['source-error'].textContent = error.name === 'AbortError'
                        ? 'import canceled. your previous copy is unchanged.' : String(error.message || error);
                } finally {
                    importing = false; ui['source-cancel'].hidden = true;
                    for (const name of ['source-own', 'source-cached', 'source-packaged']) ui[name].disabled = false;
                }
            };
            ui['source-cached'].onclick = () => finish(cached);
            ui['source-packaged'].onclick = () => run(signal => downloadRom(runtime, signal));
            ui['source-own'].onclick = () => {ui['game-source-file'].value = ''; ui['game-source-file'].click();};
            ui['game-source-file'].onchange = () => {
                const file = ui['game-source-file'].files[0]; if (file) run(() => file);
            };
            ui['source-chooser'].ondragover = event => event.preventDefault();
            ui['source-chooser'].ondrop = event => {
                event.preventDefault();
                if (event.dataTransfer.files.length !== 1) {ui['source-error'].textContent = 'drop one game image at a time.'; return;}
                run(() => event.dataTransfer.files[0]);
            };
        });
    };

    Nectar.Cdn = {
        config, storage, resource,
        configureRuntime(module) {
            module.locateFile = name => config.root + '/' + name;
            module.preRun = [() => {
                const idb = module.FS.filesystems.IDBFS;
                const getDB = idb.getDB;
                idb.getDB = (name, callback) => getDB(config.storage + '-saves:' + name, callback);
            }];
            return module;
        },
        async loadEngine(runtime, engine) {
            const [script, wasm] = await Promise.all([resource(engine), resource(engine.replace(/\.js$/, '.wasm'))]);
            const binary = await wasm.arrayBuffer();
            runtime.module.instantiateWasm = (imports, receive) => {
                WebAssembly.instantiate(binary, imports).then(result => {
                    receive(result.instance, result.module);
                    delete runtime.module.instantiateWasm;
                })
                    .catch(error => runtime.fail('could not start the engine: ' + String(error.message || error)));
                return {};
            };
            const url = URL.createObjectURL(new Blob([script], {type: 'text/javascript'}));
            try { await runtime.loadScript(url); }
            finally { URL.revokeObjectURL(url); }
        }
    };
})();

(() => {
    async function downloadData(response, expectedSize, progress) {
        if (!response.ok || !Number.isSafeInteger(expectedSize) || expectedSize <= 0 || expectedSize > 1073741824) {
            throw new Error('the game data response or package size is invalid');
        }
        if (!response.body || !progress) {
            const buffer = await response.arrayBuffer();
            if (buffer.byteLength !== expectedSize) {
                throw new Error('the game data download is incomplete');
            }
            progress?.(expectedSize, expectedSize);
            return buffer;
        }
        const bytes = new Uint8Array(expectedSize);
        const reader = response.body.getReader();
        let offset = 0;
        try {
            while (true) {
                const {done, value} = await reader.read();
                if (done) {
                    break;
                }
                if (offset + value.length > expectedSize) {
                    throw new Error('the game data does not match its manifest');
                }
                bytes.set(value, offset);
                offset += value.length;
                progress(offset, expectedSize);
            }
            if (offset !== expectedSize) {
                throw new Error('the game data download is incomplete');
            }
            return bytes.buffer;
        } finally {
            await reader.cancel().catch(() => {});
            reader.releaseLock();
        }
    }

    class BrowserDisplay {
        constructor(runtime, viewport) {
            this.runtime = runtime;
            this.viewport = viewport;
            this.limit = 4096;
            this.pending = false;
            this.size = null;
            this.observer = new ResizeObserver(() => this.schedule());
            this.observer.observe(viewport);
            window.addEventListener('resize', () => this.schedule());
            document.addEventListener('fullscreenchange', () => this.schedule());
            window.visualViewport?.addEventListener('resize', () => this.schedule());
            this.watchDensity();
        }

        watchDensity() {
            this.densityQuery = matchMedia(`(resolution: ${devicePixelRatio}dppx)`);
            this.densityQuery.addEventListener('change', () => {
                this.schedule();
                this.watchDensity();
            }, {once: true});
        }

        schedule() {
            if (this.pending) return;
            this.pending = true;
            requestAnimationFrame(() => {
                this.pending = false;
                this.resize();
            });
        }

        resize(force = false) {
            const {width, height} = this.viewport.getBoundingClientRect();
            if (width <= 0 || height <= 0) return;
            const [maxWidth, maxHeight] = height > width ? [2160, 3840] : [3840, 2160];
            const scale = Math.min(devicePixelRatio, 3, maxWidth / width, maxHeight / height,
                this.limit / width, this.limit / height);
            const next = {width: Math.max(1, Math.round(width * scale)), height: Math.max(1, Math.round(height * scale))};
            if (!force && this.size?.width === next.width && this.size?.height === next.height) return;
            this.size = next;
            if (this.runtime._nectarResize) {
                this.runtime._nectarResize(next.width, next.height);
            } else {
                this.runtime.canvas.width = next.width;
                this.runtime.canvas.height = next.height;
            }
        }
    }

    class BrowserRuntime {
        constructor() {
            this.ui = Object.fromEntries(Array.from(document.querySelectorAll('[id]'), node => [node.id, node]));
            this.logs = [];
            this.ready = false;
            this.failed = false;
            this.storage = 'not mounted';
            this.phase = 'loading';
            this.module = globalThis.Module = Nectar.Cdn.configureRuntime(this.createRuntime());
            this.display = new BrowserDisplay(this.module, this.ui.viewport);
            this.bindEvents();
            this.display.resize();
            this.start();
        }

        createRuntime() {
            return {
                canvas: this.ui.canvas,
                nectarRecord: (level, text) => this.record(level, text),
                nectarStorage: (state, error) => this.storageChanged(state, error),
                nectarConsumePendingSave: () => Nectar.SaveTransfer.clear(),
                nectarEngineReady: () => queueMicrotask(() => this.engineReady()),
                nectarSetFullscreen: enabled => this.setFullscreen(enabled),
                nectarRequestFile: action => this.files?.request(action),
                nectarChooseTexturePack: id => this.files?.selectTexture(id),
                nectarRestart: () => this.restart(),
                nectarPrepareTextures: fs => {
                    this.module.FS = fs;
                    const library = new Nectar.TextureLibrary(this.module);
                    return library.initialize().catch(error => {
                        library.error = String(error.message || error);
                        this.record('textures', library.error);
                    });
                },
                print: text => {
                    this.record('stdout', text);
                    if (String(text).toLowerCase().includes('[pc port fatal error]')) this.fail(text);
                },
                printErr: text => this.record('stderr', text),
                setStatus: text => this.setStatus(text),
                onRuntimeInitialized: () => {
                    this.phase = 'runtime ready';
                    this.display.resize(true);
                    this.setStatus('starting the engine...');
                },
                onAbort: reason => this.fail('the runtime stopped: ' + reason),
                onExit: code => this.fail('the game closed. reload to play again. exit code: ' + code)
            };
        }

        bindEvents() {
            this.ui.canvas.addEventListener('contextmenu', event => event.preventDefault());
            this.ui.canvas.addEventListener('pointerdown', () => {
                this.ui.canvas.focus({preventScroll: true});
                this.module.nectarResumeAudio?.();
            });
            window.addEventListener('keydown', event => {
                if (['F1', 'F2', 'F3'].includes(event.code)) event.preventDefault();
                this.module.nectarResumeAudio?.();
            }, true);
            this.ui.canvas.addEventListener('webglcontextlost', event => {
                event.preventDefault();
                this.fail('the graphics context was lost. save the error report, then reload.');
            });
            window.addEventListener('error', event => this.fail(event.error?.stack || event.message));
            window.addEventListener('unhandledrejection', event => this.fail(event.reason?.stack || event.reason));
            document.addEventListener('visibilitychange', () => {
                this.updatePause();
                if (document.hidden && this.ready) {
                    this.module.nectarSyncSaves?.().catch(error => this.storageChanged('unavailable', error));
                }
            });
            window.addEventListener('beforeunload', event => {
                if (this.files?.busy && !this.files.restarting) {
                    event.preventDefault();
                    event.returnValue = '';
                }
            });
            window.addEventListener('pagehide', () => this.releaseLock?.());
            window.addEventListener('pageshow', event => {
                if (event.persisted) this.fail('reload before continuing after returning through browser history.');
            });
            this.ui.report.addEventListener('click', () => Nectar.GameFiles.download(
                JSON.stringify(this.report(), null, 2), 'nectar-browser-report.json', 'application/json'));
        }

        preflight() {
            if (this.threaded && (!globalThis.isSecureContext || !globalThis.crossOriginIsolated)) {
                throw new Error('cross-origin isolation is required. run serve.py and open the local address, not the html file.');
            }
            if (typeof WebAssembly === 'undefined') {
                throw new Error('this browser does not provide webassembly');
            }
            if (this.threaded && typeof SharedArrayBuffer === 'undefined') {
                throw new Error('this browser does not provide webassembly shared memory; use the single-threaded build');
            }
            const gl = document.createElement('canvas').getContext('webgl2');
            if (!gl) throw new Error('this browser could not create a webgl 2 context');
            this.graphics = {version: gl.getParameter(gl.VERSION), maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE)};
            this.display.limit = Math.min(4096, this.graphics.maxTextureSize);
            gl.getExtension('WEBGL_lose_context')?.loseContext();
        }

        async claimSession() {
            if (!navigator.locks) {
                this.record('storage', 'tab locking unavailable; keep only one game tab open');
                return;
            }
            await new Promise((resolve, reject) => {
                navigator.locks.request(Nectar.Cdn.config.storage + '-game', {ifAvailable: true}, lock => {
                    if (!lock) {
                        reject(new Error('another game tab is using these saves. close it before opening this one.'));
                        return;
                    }
                    resolve();
                    return new Promise(release => { this.releaseLock = release; });
                }).catch(reject);
            });
        }

        loadScript(source) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = source;
                script.onload = resolve;
                script.onerror = () => reject(new Error('could not load ' + source + '; keep the update files together'));
                document.body.appendChild(script);
            });
        }

        async loadData(assets) {
            const url = 'nectar.data?v=' + assets.outputs['nectar.data'];
            let cache;
            try {
                cache = await caches.open('nectar-game-data');
                const saved = await cache.match(url);
                if (saved) {
                    this.setStatus('loading cached game data...');
                    const data = await downloadData(saved, assets.bytes);
                    this.record('cache', 'using cached game data');
                    return data;
                }
            } catch (error) {
                this.record('cache', error.message || error);
                await cache?.delete(url).catch(() => {});
            }
            const response = await fetch(url);
            const stored = cache && response.ok ? cache.put(url, response.clone()).then(async () => {
                for (const key of await cache.keys()) {
                    if (key.url !== new URL(url, location.href).href) await cache.delete(key);
                }
            }).catch(error => {
                this.record('cache', 'game data could not be cached: ' + error.message);
            }) : Promise.resolve();
            try {
                let lastPercent = -1;
                this.ui.progress.max = assets.bytes;
                const data = await downloadData(response, assets.bytes, (done, total) => {
                    const percent = Math.floor(done / total * 100);
                    if (percent === lastPercent) return;
                    lastPercent = percent;
                    this.ui.progress.value = done;
                    this.setStatus(`loading game data... ${percent}%`);
                });
                await stored;
                return data;
            } catch (error) {
                await stored;
                await cache?.delete(url).catch(() => {});
                throw error;
            }
        }

        async start() {
            try {
                const buildResponse = await Promise.resolve(new Response(JSON.stringify(Nectar.Cdn.config.build)));
                if (!buildResponse.ok) throw new Error('the build manifest is missing; keep the runtime files together');
                const build = await buildResponse.json();
                Nectar.game = build.game === 'pikmin2' ? 'pikmin2' : 'pikmin1';
                if (Nectar.game === 'pikmin2') {
                    document.title = 'open nectar · pikmin 2';
                    this.ui['source-chooser'].querySelector('.source-formats').textContent =
                        'gamecube · iso/gcm, rvz, wia, gcz, ciso, tgc, wbfs · pikmin 2 usa or europe';
                    this.module.preRun ||= [];
                    this.module.preRun.unshift(() => {
                        const idb = this.module.FS.filesystems.IDBFS;
                        const getDB = idb.getDB;
                        idb.getDB = (name, callback) => getDB.call(idb, 'nectar-pikmin2:' + name, callback);
                    });
                }
                this.threaded = build.threaded === undefined ? true : build.threaded;
                if (typeof this.threaded !== 'boolean') throw new Error('the build threading mode is invalid');
                this.preflight();
                await this.claimSession();
                let pending;
                try {
                    pending = await Nectar.SaveTransfer.read();
                } catch (error) {
                    this.record('storage', 'save restoration could not be checked: ' + error.message);
                }
                if (pending) this.module.nectarPendingSave = Nectar.SaveArchive.decode(pending);
                const source = this.ui['runtime-script'].content.querySelector('script')?.getAttribute('src');
                if (!source) throw new Error('the generated engine script is missing');
                build.runtimes ||= {[build.discKey || 'GPIE01:1']: source};
                for (const script of Object.values(build.runtimes)) {
                    if (!/^nectar(?:-pal)?\.js$/.test(script)) throw new Error('the engine list is invalid');
                }
                let assets = null;
                const response = await Promise.resolve(new Response(null, {status: 404}));
                if (response.ok) {
                    assets = await response.json();
                    if (assets.version !== 1 || !Number.isSafeInteger(assets.bytes) || assets.bytes < 1
                        || !/^[a-f0-9]{64}$/.test(assets.outputs?.['nectar.data'])) {
                        throw new Error('the game asset manifest is invalid');
                    }
                } else if (response.status !== 404) {
                    throw new Error('could not check the packaged game data; reload to try again');
                }
                const choice = await Nectar.Discs.choose(this, build.rom ? {rom: build.rom} : assets, build);
                let engine;
                if (choice.install) {
                    engine = build.runtimes[choice.install.key];
                    this.module.nectarLoadOwnGame = fs => Nectar.Discs.load(choice.install, fs, this);
                } else {
                    assets = choice.bundled;
                    engine = build.runtimes[assets.discKey || build.discKey || 'GPIE01:1'];
                    this.preloadedData = await this.loadData(assets);
                    this.module.getPreloadedPackage = (name, size) => {
                        if (!this.preloadedData || this.preloadedData.byteLength !== size) throw new Error('game data does not match its metadata');
                        const buffer = this.preloadedData;
                        this.preloadedData = null;
                        return buffer;
                    };
                    await this.loadScript('nectar-assets.js');
                }
                if (!engine) throw new Error('this web build does not contain an engine matching your game copy');
                await Nectar.Cdn.loadEngine(this, engine);
            } catch (error) {
                this.fail(error.message || error);
            }
        }

        engineReady() {
            if (this.failed) return;
            this.ready = true;
            this.phase = 'engine loop';
            this.files = new Nectar.GameFiles(this.module, this.ui['file-picker'], (level, text) => this.record(level, text));
            this.display.resize(true);
            this.ui.loading.hidden = true;
            this.ui.canvas.focus({preventScroll: true});
            this.updatePause();
            if (this.storage !== 'ready') this.files.notice('browser storage is unavailable. saves and packs may not persist.', true);
        }

        storageChanged(state, error) {
            this.storage = state;
            this.record('storage', error ? `${state}: ${error}` : state);
            if (state === 'unavailable' && this.ready) this.files.notice('browser storage failed. back up your saves in game settings.', true);
        }

        updatePause() {
            if (!this.ready) return;
            const paused = document.hidden || this.failed;
            this.module._nectarSetPaused(Number(paused));
            this.module.nectarSetAudioPaused?.(paused);
        }

        async setFullscreen(enabled) {
            try {
                if (enabled && !document.fullscreenElement) await document.documentElement.requestFullscreen();
                else if (!enabled && document.fullscreenElement) await document.exitFullscreen();
            } catch (error) {
                this.files?.notice('fullscreen was blocked by the browser. try selecting the fullscreen option again.', true);
                this.record('fullscreen', error.message || error);
            }
        }

        async restart() {
            if (this.files?.busy) return;
            try {
                await this.module.nectarSyncSaves();
                location.reload();
            } catch (error) {
                this.files?.notice('restart cancelled: saves could not be written.', true);
                this.record('storage', error.message || error);
            }
        }

        setStatus(text) {
            if (!this.failed && text) {
                this.ui.status.hidden = false;
                this.ui.status.textContent = String(text);
            }
        }

        fail(message) {
            this.failed = true;
            this.phase = 'failed';
            this.record('fatal', message);
            this.ui.status.textContent = String(message);
            this.ui.status.hidden = false;
            this.ui.loading.hidden = false;
            this.ui.progress.hidden = true;
            this.ui.report.hidden = false;
            this.updatePause();
        }

        record(level, message) {
            this.logs.push({time: new Date().toISOString(), level, text: String(message).slice(0, 2048)});
            if (this.logs.length > 512) this.logs.shift();
        }

        report() {
            return {version: 3, phase: this.phase, storage: this.storage, graphics: this.graphics,
                threaded: this.threaded, isolated: globalThis.crossOriginIsolated, userAgent: navigator.userAgent,
                canvas: this.display?.size, runtime: this.ready ? this.module.nectarSnapshot?.() : null,
                logs: this.logs.slice()};
        }
    }

    new BrowserRuntime();
})();
</script>
